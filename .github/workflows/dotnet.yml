name: dotnet

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - run: dotnet build Maifetch.sln --configuration Release
      - run: dotnet run --project tests/Maifetch.Tests/Maifetch.Tests.fsproj --configuration Release
      - run: dotnet run --project src/Maifetch/Maifetch.fsproj -- --help
